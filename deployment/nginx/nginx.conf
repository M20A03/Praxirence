user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance & Optimization
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off; # Prevent information disclosure of Nginx version

    # --------------------------------------------------------------------------
    # Slowloris & Connection Starvation Defenses
    # --------------------------------------------------------------------------
    client_body_timeout       15s;
    client_header_timeout     15s;
    keepalive_timeout         30s;
    send_timeout              15s;
    client_body_buffer_size   128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --------------------------------------------------------------------------
    # DDoS & Flood Mitigation Rate Limiting Zones
    # --------------------------------------------------------------------------
    # Global concurrent connection limit per IP
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    limit_conn addr_conn 30;

    # General API endpoints: 30 requests/sec with burst buffer
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;

    # Sensitive Auth & OTP endpoints: max 5 requests/min per IP
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

    # Heavy Audio/Media uploads: max 10 requests/min per IP
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;

    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Bot Filtering & Threat Actor User-Agent Map
    # --------------------------------------------------------------------------
    map $http_user_agent $is_bad_bot {
        default 0;
        ~*(?i)(nikto|sqlmap|masscan|acunetix|havij|zgrab|nmap|dirbuster|gobuster|wpscan|hydra) 1;
        ~*(?i)(censys|shodan|netsparker|openvas|nessus|metasploit|burpcollaborator) 1;
        ~*(?i)(binlar|casper|checkprivacy|cmsworldmap|comodo|diavol|dotbot|feedfinder) 1;
        ~*(?i)(flicky|g00g1e|ia_archiver|kmccrew|libwww-perl|planetwork|purebot|pycurl) 1;
        ~*(?i)(skygrid|sucker|turnitinbot|vikspider|zmeu) 1;
    }

    # Upstream Backend
    upstream praxirence_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Block malicious automated vulnerability scanners and malicious bots
        if ($is_bad_bot) {
            return 403 "Blocked: Automated security scanner / malicious bot fingerprint detected by Praxirence WAF.\n";
        }

        # ----------------------------------------------------------------------
        # OWASP Security Headers (Defense in Depth)
        # ----------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=('self'), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none';" always;
        add_header X-DPDP-Compliance "India-DPDP-Act-2023-Aligned" always;

        # ----------------------------------------------------------------------
        # Endpoint Routing & Granular Rate Limiting
        # ----------------------------------------------------------------------

        # Sensitive Auth & OTP Endpoints (Brute-Force & Credential Stuffing Shield)
        location /auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://praxirence_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Audio Upload Ingestion Pipeline (Upload Buffer & Rate Limit)
        location /visits/upload-audio {
            client_max_body_size 50M;
            limit_req zone=upload_zone burst=5 nodelay;
            proxy_pass http://praxirence_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_request_buffering on; # Buffer completely to facilitate ClamAV scan
        }

        # Real-Time WebSocket Copilot Pipeline
        location /ws/ {
            proxy_pass http://praxirence_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # General API Endpoints
        location / {
            limit_req zone=general_zone burst=25 nodelay;
            proxy_pass http://praxirence_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
