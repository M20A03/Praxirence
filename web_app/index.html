            "@type": "PostalAddress",

          },
          "contactPoint": {

            "contactType": "Clinical Support & Hospital Inquiries",

          },
          "knowsAbout": [

            "Electronic Health Records (EHR)",
            "Ayushman Bharat Digital Mission (ABDM)",
            "DPDP Act 2023 Compliance",
            "Telemedicine Practice Guidelines"
          ]
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.praxirence.com/#software",
          "name": "Praxirence Clinical Intelligence Suite",
          "operatingSystem": "Android, iOS, Web",
          "applicationCategory": "HealthApplication",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          },
          "description": "Cross-platform ambient AI consultation recording, local Whisper ASR transcription, doctor verification, and synchronized care vault for clinics and hospitals.",
          "featureList": [
            "Zero Audio Retention RAM-only transcription",
            "Doctor-verified tamper-proof prescriptions with SHA-256 signatures",
            "Native offline care plan sync via WebSocket Gateway",
            "ABDM FHIR M2 interoperability",
            "OPD queue management with sequential tokens"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://www.praxirence.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does Praxirence store or record consultation audio?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Praxirence strictly implements a Zero Audio Retention architecture. Audio streams are processed ephemerally in RAM during the consultation solely to generate the textual transcript. Once parsed, the raw audio buffer is permanently erased from memory. Audio is never stored on disk or used for training without explicit clinical authorization."
              }
            },
            {
              "@type": "Question",
              "name": "Why is physician verification mandatory before care plan dispatch?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "In compliance with established telemedicine practice guidelines and medico-legal standards, AI can propose clinical notes, but only a qualified attending physician can legally prescribe and dispatch treatments. Praxirence locks the dispatch button until the clinician reviews and checks the clinical sign-off box."
              }
            },
            {
              "@type": "Question",
              "name": "How does offline mode work when the clinic has no internet?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Both Praxirence mobile apps feature local offline SQLite and SQLiteCipher vaults. If internet is lost during a consultation, care plans are queued and signed locally with cryptographic timestamps. When connectivity is restored, plans sync automatically to the cloud engine."
              }
            },
            {
              "@type": "Question",
              "name": "How do patients receive and access their care plan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Patients receive their full signed care plan, vernacular voice guidance, prescription PDF, and scheduled medication alarms directly inside the native Praxirence Care App with full offline access and complete biometric encryption."
              }
            },
            {
              "@type": "Question",
              "name": "How does Praxirence comply with the DPDP Act 2023 and ABDM?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Praxirence acts as a compliant Data Processor under the Digital Personal Data Protection Act 2023. Patient health data is encrypted using AES-256 GCM, consent logs are immutably recorded, and patients can request data erasure or export at any time. Our schema is natively compatible with ABDM FHIR M2 health standards."
              }
            }
          ]
        },
