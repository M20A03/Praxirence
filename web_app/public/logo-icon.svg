<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="leaf-grad-icon" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ribbon-grad-icon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="glow-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#glow-icon)">
    <!-- 1. Organic Health Leaf -->
    <path d="M48 10 C32 12, 22 24, 23 42 C28 35, 36 31, 48 30 C49 22, 49 14, 48 10 Z" fill="url(#leaf-grad-icon)"/>
    <path d="M26 38 C32 34, 38 31, 46 29" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- 2. Stylized Medical 'P' Ribbon Loop -->
    <path d="M32 32 L32 86 C32 88.2, 33.8 90, 36 90 C38.2 90, 40 88.2, 40 86 L40 58 C45 58, 76 58, 76 34 C76 14, 44 14, 32 32 Z" fill="url(#ribbon-grad-icon)"/>

    <!-- 3. Inner Loop Hollow with Medical Plus Symbol -->
    <circle cx="56" cy="36" r="14" fill="#0b1728"/>
    <circle cx="56" cy="36" r="13" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>
    <path d="M56 28 L56 44 M48 36 L64 36" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="73" cy="24" r="3.5" fill="#34d399"/>
  </g>
</svg>
